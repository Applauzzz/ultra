# EEG MAE Training Configuration - Large Model
# Maximum capacity for best performance

name: eeg_mae_large
dump_dir: outputs/eeg_mae_large

seed: 42
steps: 20000
grad_acc_steps: 2  # Gradient accumulation for large model

data:
  data_path: /mnt/zehao/eeg_infra/data
  subset: all
  window_duration: 10000
  clip: 10.0
  masking_ratio: 0.75
  masking_window: 200
  masking_overlap: 20
  use_block_masking: false
  batch_size: 128  # Smaller batch for large model
  num_workers: 16
  prefetch_factor: 3
  persistent_workers: true

model:
  # Encoder: 768d, 24 layers
  encoder_embed_dim: 768
  encoder_depth: 24
  encoder_heads: 12
  encoder_head_dim: 64
  encoder_mlp_dim_ratio: 2.66
  encoder_use_geglu: true

  # Decoder: 768d, 12 layers
  decoder_embed_dim: 768
  decoder_depth: 12
  decoder_heads: 12
  decoder_head_dim: 64
  decoder_mlp_dim_ratio: 2.66
  decoder_use_geglu: true

  patch_size: 200
  patch_overlap: 20
  freqs: 4
  noise_ratio: 0.0025
  masking_ratio: 0.75
  token_avg: true  # Enable token averaging for large model
  token_avg_lambda: 0.1
  meta_init: true

optim:
  lr: 1.5e-4
  beta1: 0.9
  beta2: 0.95
  weight_decay: 0.0
  clip: 5.0
  scheduler: cosine
  warmup: 1000
  lr_min_ratio: 0.1

distributed:
  dp_replicate: 1
  dp_shard: 8  # 8 GPUs for large model
  tp_size: 1
  sp_size: 1
  fsdp_type: full_shard

checkpoint:
  dump:
    every: 2000

logging:
  freq: 10
  wandb:
    project: eeg_mae
    mode: disabled  # Change to "online" to enable WandB logging
    tags: ["eeg", "mae", "large"]
