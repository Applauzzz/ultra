dump_dir: /mnt/zehao/modelbase/nemotron/freelong_ckpt/hgrn-ori
name: hgrn

steps: 3
varlen: false
seed: 42
grad_acc_steps: 1
optim:
  scheduler: cosine
  lr: 3e-5
  weight_decay: 0.0
  warmup: 200
  lr_min_ratio: 0.001
  clip: 1.0
distributed:
  fsdp_type: full_shard
  compile: false
  model_dtype: bf16
  matmul_allow_tf32: false
  activation_checkpointing: true
  tp_size: 1
  dp_replicate: 1
  dp_shard: 1
  sp_size: 1
model:
  name_type: backbone
  model_name: "hgrn"
  config_path: "/mnt/modelbase/modelbase/hgrn-config"
  # pt_path: "/mnt/jfzn/lzh/modelbase/Qwen3-8B-Base"
  seed: 42
  dim: 512
  n_layers: 4
  meta_init: true
  # n_heads: 32
  vocab_size: 32000
  # memory_efficient_checkpointing: False
  # chunk_size: null
  # rope_theta: 1_000_000
  # ffn_dim_multiplier: 3.0
  # multiple_of: 256

data:
  sources:
    jsonl./mnt_upfs/datasets/Nemotron-CC-v2_High-Quality_jsonl: 100
    # jsonl./mnt_upfs/datasets/Nemotron-CC-v2_Medium-High-Quality_jsonl: 15.0
    # jsonl./mnt_upfs/datasets/Nemotron-CC-v2_Medium-Quality_jsonl: 10.0
    # jsonl./mnt_upfs/datasets/Nemotron-CC-v2_High-Quality-Synthetic_jsonl: 20.0
    # jsonl./mnt_upfs/datasets/Nemotron-CC-v2_Diverse-QA_jsonl: 5.0
    # jsonl./mnt_upfs/datasets/Nemotron-CC-v2_Translated-Diverse-QA_jsonl: 5.0
    # jsonl./mnt_upfs/datasets/Nemotron-Pretraining-SFT-v1_Nemotron-SFT-Code_jsonl: 5.0
    # jsonl./mnt_upfs/datasets/Nemotron-Pretraining-SFT-v1_Nemotron-SFT-General_jsonl: 5.0
    # jsonl./mnt_upfs/datasets/Nemotron-Pretraining-SFT-v1_Nemotron-SFT-MATH_jsonl: 5.0
    # jsonl./mnt_upfs/datasets/Nemotron-CC-Math-v1_3_jsonl: 5.0
  batch_size: 1
  prefetch_size: 2
  # seq_len: 4096
  # seq_len: 4096
  seq_len: 32768
  # seq_len: 131072
  # seq_len: 1677216
  n_views: 1
  load_async: true
  add_bos: False
  add_eos: False
  pad_token_id: 0
  tokenizer:
    name: gla
    path: /mnt/modelbase/modelbase/hgrn-1.3B
checkpoint:
  # init_ckpt_path: /mnt/jfzn/lzh/modelbase/gla-1B-dcp # must be a dcp model
  dump:
    every: 1000
    keep: 4
logging:
  freq: 1
  # wandb:
  #   dir: ./wandb_log
  #   entity: XLM
  #   project: freelong-hgrn
  #   group: ultra-400M