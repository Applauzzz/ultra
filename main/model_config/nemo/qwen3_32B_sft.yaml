dump_dir: /mnt/zehao/modelbase/nemotron/qwen3_32B
name: qwen3-32B_sft
steps: 64
varlen: false
seed: 42
grad_acc_steps: 1
optim:
  scheduler: cosine
  lr: 3e-6
  weight_decay: 0.0
  warmup: 200
  lr_min_ratio: 0.001
  clip: 1.0
distributed:
  fsdp_type: full_shard
  compile: false
  model_dtype: bf16
  matmul_allow_tf32: true
  activation_checkpointing: true
  tp_size: 1
  dp_replicate: 1
  dp_shard: 4
  sp_size: 8
model:
  name_type: backbone
  model_name: "qwen3"
  config_path: "/mnt/modelbase/modelbase/qwen3-32b-fla"
  pt_path: "/mnt/modelbase/modelbase/qwen3-32b-fla"
  seed: 42
  dim: 5120
  n_layers: 64
  meta_init: true
  # n_heads: 32
  vocab_size: 151936
  # memory_efficient_checkpointing: False
  # chunk_size: null
  # rope_theta: 1_000_000
  # ffn_dim_multiplier: 3.0
  # multiple_of: 256

data:
  sources:
    jsonl./mnt/zehao/database/xixi_sft: 100.0
    # sources = [
    #     Source(25.0, "/mnt_upfs/datasets/CC-HQ_qwen3/processed_data_*_text_document*.bin"),
    #     Source(15.0, "/mnt_upfs/datasets/CC-MHQ_qwen3/processed_data_*_text_document*.bin"),
    #     Source(10.0, "/mnt_upfs/datasets/CC-MQ_qwen3/processed_data_*_text_document*.bin"),
    #     Source(20.0, "/mnt_upfs/datasets/CC-HQ-Synthetic_qwen3/processed_data_*_text_document*.bin"),
    #     Source(5.0, "/mnt_upfs/datasets/CC-Diverse-QA_qwen3/processed_data_*_text_document*.bin"),
    #     Source(5.0, "/mnt_upfs/datasets/CC-Translated-Diverse-QA_Qwen3/processed_data_*_text_document*.bin"),
    #     Source(5.0, "/mnt_upfs/datasets/SFT-Code_qwen3/processed_data_*_text_document*.bin"),
    #     Source(5.0, "/mnt_upfs/datasets/SFT-General_qwen3/processed_data_*_text_document*.bin"),
    #     Source(5.0, "/mnt_upfs/datasets/SFT-MATH_qwen3/processed_data_*_text_document*.bin"),
    #     Source(5.0, "/mnt_upfs/datasets/CC-Math-3_qwen3/processed_data_*_text_document*.bin"),

    # ]
  batch_size: 1
  prefetch_size: 16
  seq_len: 65536
  n_views: 1
  load_async: true
  add_bos: False
  add_eos: False
  pad_token_id: 0
  tokenizer:
    name: qwen3
    path: /mnt_upfs/models/qwen3/Qwen3-32B
checkpoint:
  init_ckpt_path: /mnt/modelbase/modelbase/dcp-qwen3-32b # must be a dcp model
  dump:
    every: 1000
    keep: 4
logging:
  freq: 1
  wandb:
    dir: ./wandb_log
    entity: XLM
    project: xixi_qwen3_sft
    group: qwen3-32B_sft