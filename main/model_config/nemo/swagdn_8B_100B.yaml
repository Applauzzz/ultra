name: swagdn-8B-CC
dump_dir: /mnt/zehao/modelbase/nemotron/qwen-8B-100B
seed: 42
varlen: false
grad_acc_steps: 4
gc_collect_freq: 1000
random_data: false
steps: 10000
data:
  root_dir: null
  sources:
    jsonl./mnt_upfs/datasets/Nemotron-CC-v2_High-Quality_jsonl: 25.0
    jsonl./mnt_upfs/datasets/Nemotron-CC-v2_Medium-High-Quality_jsonl: 15.0
