  batch_size: 8
  seq_len: 8192
  n_views: 1
  seed: 42
  add_bos: false
  add_eos: false
  load_async: true
  prefetch_size: 256
  pad_token_id: 0
  tokenizer:
    name: qwen3
    path: /mnt/modelbase/modelbase/qwen-3-1.7b-base
optim:
  lr: 0.0003
  weight_decay: 0.0
  epsilon: 1.0e-12
  beta1: 0.9
  beta2: 0.95
  clip: 1.0
  scheduler: cosine
  warmup: 200
  lr_min_ratio: 0.001
  cycle_length: 1.0
  cosine_theta: 1.0
  annealing_step: 1000
  decay_fraction: 0.1
  exp_factor: 0.5
model:
  name_type: backbone
  model_name: qwen3
  pt_path: /mnt/modelbase/modelbase/qwen3-8b-fla-model
  seed: 42
  config_path: /mnt/modelbase/modelbase/qwen3-8b-fla-model
  dim: 4096
  n_layers: 36
  max_seqlen: 8192
  vocab_size: 151936
  meta_init: true
distributed:
  dp_shard: 32
  dp_replicate: 1
  sp_size: 1
  tp_size: 1
  activation_checkpointing: true
  compile: false
  fsdp_type: full_shard
  model_dtype: bf16
  float8_recipe: null
  float8_filter: layers\.[0-9]+\.
  matmul_allow_tf32: true
  detect_anomaly: false
  compile_cache_size_limit: 8
  spawn_method: forkserver
env:
