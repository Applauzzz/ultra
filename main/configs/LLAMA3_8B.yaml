dump_dir: /mnt/jfzn/lzh/modelbase/ckpt/LLAMA-3-sft-tulumix-3
name: LLAMA-8B-sft-tulumix
steps: 4_000
varlen: false
seed: 42
grad_acc_steps: 4
optim:
  scheduler: cosine
  lr: 1e-5
  weight_decay: 0.0
  warmup: 200
  lr_min_ratio: 0.001
  clip: 1.0
distributed:
  fsdp_type: full_shard
  compile: false
  model_dtype: bf16
  matmul_allow_tf32: false
  activation_checkpointing: false
  tp_size: 1
  dp_replicate: 1
  dp_shard: 8
  sp_size: 1
model:
  name_type: backbone
  model_name: "llama3"
  config_path: "/mnt/jfzn/lzh/modelbase/LLAMA_convert/FLA-llama3-8b"
  # pt_path: "/mnt/jfzn/lzh/modelbase/Qwen3-8B-Base"
  seed: 42
  dim: 4096
  n_layers: 32
  meta_init: true
  # n_heads: 32
  vocab_size: 128256
  
  # rope_theta: 1_000_000
  # ffn_dim_multiplier: 3.0
  # multiple_of: 256

data:
  sources:
    load_from_disk./mnt/jfzn/lzh/database/tulu-3-sft-mixture_shuffle_hfds: 100.0
  batch_size: 1
  prefetch_size: 32
  seq_len: 4096
  n_views: 1
  load_async: true
  add_bos: true
  add_eos: true
  pad_token_id: 128255
  tokenizer:
    name: llama3
    path: /mnt/jfzn/lzh/modelbase/llama-3-8b-Instruct
checkpoint:
  init_ckpt_path: /mnt/jfzn/lzh/modelbase/LLAMA_convert/DCP-llama3-8b
  dump:
    every: 1_000
    keep: 4
logging:
  freq: 1
  wandb:
    dir: ./wandb_log
    entity: XLM
    project: qwen3_sft
    group: LLAMA_sft_tulu