dump_dir: /mnt/zehao/modelbase/gla-1B-128k-chunksize8k
name: gla-1B-128k-chunksize8k
steps: 3
varlen: false
seed: 42
grad_acc_steps: 1
optim:
  scheduler: cosine
  lr: 2e-4
  weight_decay: 0.0
  warmup: 200
  lr_min_ratio: 0.001
  clip: 1.0
distributed:
  fsdp_type: full_shard
  compile: false
  model_dtype: bf16
  matmul_allow_tf32: false
  activation_checkpointing: true
  tp_size: 1
  dp_replicate: 1
  dp_shard: 1
  sp_size: 8
model:
  name_type: backbone
  model_name: "gla"
  config_path: "/mnt/zehao/modelbase/gla-1.3B-100B"
  # pt_path: "/mnt/jfzn/lzh/modelbase/Qwen3-8B-Base"
  seed: 42
  dim: 2048
  n_layers: 24
  meta_init: true
  # n_heads: 32
  vocab_size: 32000
  # memory_efficient_checkpointing: False
  # chunk_size: null
  # rope_theta: 1_000_000
  # ffn_dim_multiplier: 3.0
  # multiple_of: 256

data:
  sources:
    jsonl./mnt_upfs/datasets/Nemotron-CC-v2_High-Quality_jsonl: 25.0
    jsonl./mnt_upfs/datasets/Nemotron-CC-v2_Medium-High-Quality_jsonl: 15.0
    jsonl./mnt_upfs/datasets/Nemotron-CC-v2_Medium-Quality_jsonl: 10.0
    jsonl./mnt_upfs/datasets/Nemotron-CC-v2_High-Quality-Synthetic_jsonl: 20.0
    jsonl./mnt_upfs/datasets/Nemotron-CC-v2_Diverse-QA_jsonl: 5.0
    jsonl./mnt_upfs/datasets/Nemotron-CC-v2_Translated-Diverse-QA_jsonl: 5.0
    jsonl./mnt_upfs/datasets/Nemotron-Pretraining-SFT-v1_Nemotron-SFT-Code_jsonl: 5.0
    jsonl./mnt_upfs/datasets/Nemotron-Pretraining-SFT-v1_Nemotron-SFT-General_jsonl: 5.0
    jsonl./mnt_upfs/datasets/Nemotron-Pretraining-SFT-v1_Nemotron-SFT-MATH_jsonl: 5.0
    jsonl./mnt_upfs/datasets/Nemotron-CC-Math-v1_3_jsonl: 5.0
  batch_size: 4
  prefetch_size: 128
  # seq_len: 8192
  # seq_len: 10240
  # seq_len: 16384
  seq_len: 32768
  # seq_len: 65536
  # seq_len: 524288
  # seq_len: 4194304  # 4M
  # seq_len:  16777216 #16M 
  # seq_len: 33554432  # 32M
  # seq_len: 67108864  # 64M
  # seq_len: 134217728  # 128M
  # seq_len: 1073741824  # 1B
  n_views: 1
  load_async: true
  add_bos: False
  add_eos: False
  pad_token_id: 0
  tokenizer:
    name: gla
    path: /mnt/zehao/modelbase/gla-7B-mistral-20B
checkpoint:
  # init_ckpt_path: /mnt/jfzn/lzh/modelbase/gla-1B-dcp # must be a dcp model
  dump:
    every: 1_000_0
    keep: 4
logging:
  freq: 1
  wandb:
    dir: ./wandb_log
    entity: XLM
    project: freelong-dbuge
    group: chunk_ablation