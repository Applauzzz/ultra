dump_dir: /mnt/jfzn/lzh/modelbase/dump
name: qwen3-8B-sft-tulumix
steps: 4_000
varlen: false
seed: 42
grad_acc_steps: 1
optim:
  scheduler: cosine
  lr: 1e-5
  weight_decay: 0.0
  warmup: 200
  lr_min_ratio: 0.001
  clip: 1.0
distributed:
  fsdp_type: full_shard
  compile: false
  model_dtype: bf16
  matmul_allow_tf32: false
  activation_checkpointing: false
  tp_size: 1
  dp_replicate: 1
  dp_shard: 8
  sp_size: 1
model:
  name_type: backbone
  model_name: "qwen3"
  config_path: "/mnt/modelbase/modelbase/qwen3-8b-fla-model"
  # pt_path: "/mnt/jfzn/lzh/modelbase/Qwen3-8B-Base"
  seed: 42
  dim: 4096
  n_layers: 36
  meta_init: true
  # n_heads: 32
  vocab_size: 151936
  
  # rope_theta: 1_000_000
  # ffn_dim_multiplier: 3.0
  # multiple_of: 256

data:
  sources:
    load_from_disk./mnt/zehao/database/slimpajama-test-dataset: 100.0
  batch_size: 1
  prefetch_size: 32
  seq_len: 4096
  n_views: 1
  load_async: true
  add_bos: False
  add_eos: False
  pad_token_id: 151643
  tokenizer:
    name: qwen3
    path: /mnt/zehao/modelbase/qwen-3-8b-base
checkpoint:
  # init_ckpt_path: /mnt/jfzn/lzh/modelbase/DCP-Qwen3-8B-Base
  dump:
    every: 1_000
    keep: 4
logging:
  freq: 1
